# 复制为 config.yaml 后填写真实连接信息（config.yaml 勿提交）
mes:
  base_url: ""
  auth_type: password
  username: ""
  password: ""
  token: ""
  enterprise_code: ""
  extra_headers: "{}"
  verify_ssl: true
  timeout: 30
api_docs:
  endpoints: []
  raw_docs: ""
data_dictionary:
  work_orders: []
  equipment_events: []
  quality_records: []
deepseek:
  provider: deepseek
  api_key: ""
  base_url: https://api.deepseek.com
  model: deepseek-chat

# P0-1 本机 Cursor Local 写码（默认关闭；请在引擎「配置中心 → 写码车道」填写）
code_dev:
  enabled: false
  cursor_api_key: ""
  model: composer-2.5
  max_concurrent: 1
  cursor_timeout_sec: 2700
  default_workspace: ""

# P0-3 本机目录直读审码（默认关闭；无 Git / 无 IDE Bridge）
code_review:
  enabled: false
  max_files: 40
  max_file_bytes: 120000
  max_total_bytes: 800000
  default_workspace: ""

# P0-2 人触发提交（功能插件 code-commit 须启用；此处 enabled 默认 true）
code_commit:
  enabled: true
  default_workspace: ""
  work_branch: ""          # 空则按用户名自动生成；禁止 main/master
  remote_name: origin
  default_push: true       # 确认卡默认勾选推送
  use_skill_review: true
  allow_blocked: false     # 调试用：强制允许带阻断项提交
  max_files: 80

# P1 自动化部署（仅本机 SSH；境外 Git 不用 Actions）
# 功能插件 code-deploy 须启用；界面只暴露下列核心项
code_deploy:
  enabled: false
  provider: local_ssh
  default_ref: HEAD              # 默认分支 / tag
  health_url: ""                 # 部署后探活（公网入口，可经 nginx，如 http://主机:8092/）
  default_workspace: ""          # 本地项目路径（git 根）
  ssh_host: ""
  ssh_user: ""
  ssh_key_path: ""               # 如 ~/.ssh/id_ed25519（只填路径）
  ssh_app_path: ""               # 远端目录，如 /www/wwwroot/DSH-ZR-WorkBuddy
  ssh_port: 22
  remote_engine_port: 8091       # 远端引擎回环端口；与 health_url 可不同，勿填 8000/反代口
  auto_restart_engine: true      # 仅重启本应用引擎（校验 PID/cmdline）
  auto_restart_bridge: false     # 默认只同步 bridge；业务验收看引擎。需远端宿主收尾再改 true
  # 以下有默认值，界面不展示
  default_env: staging
  env_whitelist: [staging]
  allow_production: false
  health_timeout_sec: 8

# 第三方 / feature 安装（P2；业务验收看引擎功能插件页）
feature_install:
  max_zip_bytes: 5242880         # zip 最大字节
  max_files: 200
  allow_force: true              # 是否允许覆盖已有 features/<id>
