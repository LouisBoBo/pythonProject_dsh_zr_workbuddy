# 复制为 config.yaml 后填写真实连接信息（config.yaml 勿提交）
mes:
  base_url: ""
  auth_type: password
  username: ""
  password: ""
  token: ""
  enterprise_code: ""
  extra_headers: "{}"
  verify_ssl: true
  timeout: 30
api_docs:
  endpoints: []
  raw_docs: ""
data_dictionary:
  work_orders: []
  equipment_events: []
  quality_records: []
deepseek:
  provider: deepseek
  api_key: ""
  base_url: https://api.deepseek.com
  model: deepseek-chat

# P0-1 本机 Cursor Local 写码（默认关闭；请在引擎「配置中心 → 写码车道」填写）
code_dev:
  enabled: false
  cursor_api_key: ""
  model: composer-2.5
  max_concurrent: 1
  cursor_timeout_sec: 2700
  default_workspace: ""

# P0-3 本机目录直读审码（默认关闭；无 Git / 无 IDE Bridge）
code_review:
  enabled: false
  max_files: 40
  max_file_bytes: 120000
  max_total_bytes: 800000
  default_workspace: ""

# P0-2 人触发提交（功能插件 code-commit 须启用；此处 enabled 默认 true）
code_commit:
  enabled: true
  default_workspace: ""
  work_branch: ""          # 空则按用户名自动生成；禁止 main/master
  remote_name: origin
  default_push: true       # 确认卡默认勾选推送
  use_skill_review: true
  allow_blocked: false     # 调试用：强制允许带阻断项提交
  max_files: 80
