# WorkBuddy 新项目公网入口（8093）→ 引擎回环（勿动 8092 旧站）
# 引擎 runtime.yaml: host 127.0.0.1 / port 8095
# 配置中心: entry_url=http://<公网>:8093/  remote_engine_port=8095

upstream wb_engine_8095 {
    server 127.0.0.1:8095;
}

server {
    listen 8093;
    listen [::]:8093;
    server_name _;

    location / {
        proxy_pass http://wb_engine_8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    access_log /www/wwwlogs/dsh-workbuddy-8093.log;
    error_log  /www/wwwlogs/dsh-workbuddy-8093.error.log;
}
