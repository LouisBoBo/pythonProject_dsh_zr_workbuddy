# WorkBuddy 一体入口：公网 HTTPS :8093 → 聊天壳（对齐本机 :3080）
# 引擎仍在回环，经 /workbuddy/ 访问；勿改 8092 旧站。
#
# 远端约定：
#   dsh web → 127.0.0.1:3080（须带 --trusted-host <公网IP>）
#   引擎   → 127.0.0.1:8095
# 配置中心 entry_url / 用户打开：https://<公网>:8093/
#
# 为何 HTTPS：公网明文 HTTP 非 secure context，浏览器无 crypto.randomUUID；
# DSH 在 <head> 开头就加载 client 脚本，nginx sub_filter 插在 </head> 太晚无效。
# 自签证书目录示例（宝塔）：
#   /www/server/panel/vhost/cert/dsh-workbuddy/{fullchain,privkey}.pem
# 生成：
#   openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#     -keyout .../privkey.pem -out .../fullchain.pem -subj "/CN=<公网IP>"
# 用户须接受证书警告；HTTP 访问同端口会失败（仅 SSL）。

upstream wb_host_3080 {
    server 127.0.0.1:3080;
}

upstream wb_engine_8095 {
    server 127.0.0.1:8095;
}

server {
    listen 8093 ssl;
    listen [::]:8093 ssl;
    server_name _;

    ssl_certificate     /www/server/panel/vhost/cert/dsh-workbuddy/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/dsh-workbuddy/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 默认：聊天壳（与本机 http://127.0.0.1:3080 一致）
    location / {
        proxy_pass http://wb_host_3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 引擎 SPA / 配置中心（可选）
    location /workbuddy/ {
        proxy_pass http://wb_engine_8095/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    access_log /www/wwwlogs/dsh-workbuddy-8093.log;
    error_log  /www/wwwlogs/dsh-workbuddy-8093.error.log;
}
