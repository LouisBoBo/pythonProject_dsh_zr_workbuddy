# WorkBuddy 一体入口（示例）
# 目标：同事浏览器只开一个地址，体验接近本机 http://127.0.0.1:3080
#
# 假设远端：
#   - 聊天壳 dsh web 监听 127.0.0.1:3080
#   - 业务引擎监听 127.0.0.1:8091（code_deploy.remote_engine_port）
#
# 用法：复制到服务器 nginx，改 server_name / 证书后 reload。
# 配置中心「浏览器一体入口」填：https://workbuddy.example.com/

upstream wb_host {
    server 127.0.0.1:3080;
}

upstream wb_engine {
    server 127.0.0.1:8091;
}

server {
    listen 80;
    server_name workbuddy.example.com;

    # 默认进聊天壳（与本机 :3080 一致）
    location / {
        proxy_pass http://wb_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 可选：引擎 SPA / API（配置中心、探活备用）
    location /workbuddy/ {
        proxy_pass http://wb_engine/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
